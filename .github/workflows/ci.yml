name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      # TODO(supply-chain): pin third-party actions by commit hash
      # (docs/SUPPLY_CHAIN_SECURITY.md §3).
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (strict, charter §20)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Check all targets
        run: cargo check --workspace --all-targets

  licenses:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # gitleaks-action v2+ requires a paid license for org repos.
      # We run the gitleaks BINARY directly (MIT-licensed, free) —
      # same tool, no license wrapper needed.
      - name: Install and run gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          ./gitleaks detect --source . --report-format json --report-path gitleaks-report.json --exit-code 1 --redact
      - name: Upload report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  schema:
    name: Policy schema and vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: JSON parse check (full schema validation = ISS-010)
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys
          files = [p for p in pathlib.Path('.').rglob('*.json')]
          assert files, "no JSON files found"
          for p in sorted(files):
              json.loads(p.read_text(encoding="utf-8"))
              print(f"OK  {p}")
          print(f"{len(files)} JSON files parsed")
          PYEOF
