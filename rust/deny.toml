# cargo-deny — Politique licences et sources (docs/SUPPLY_CHAIN_SECURITY.md §1)
# Aucune dépendance au stade squelette ; cette configuration servira dès la
# première dépendance ajoutée (spikes sprint 1).

[licenses]
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
