<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Vigile</title>
    <style>
        :root { --bg:#0f0f1a; --surface:#1a1a2e; --card:#16213e; --text:#e4e6eb; --muted:#8892b0; --accent:#64ffda; --ok:#50fa7b; --warn:#f1fa8c; --err:#ff5555; --border:#2a2a4a; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
        nav { width:220px; background:var(--surface); padding:1rem; border-right:1px solid var(--border); }
        nav h1 { color:var(--accent); margin-bottom:1.5rem; font-size:1.2rem; }
        nav a { display:block; padding:0.5rem 0.8rem; margin-bottom:0.3rem; color:var(--muted); text-decoration:none; border-radius:6px; }
        nav a:hover, nav a.active { background:var(--card); color:var(--accent); }
        main { flex:1; padding:1.5rem; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1rem; margin-bottom:1rem; }
        .badge { padding:2px 10px; border-radius:20px; font-size:0.8rem; }
        .badge.ok { color:var(--ok); } .badge.err { color:var(--err); } .badge.warn { color:var(--warn); }
        table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
        th { background:var(--surface); padding:0.5rem 1rem; text-align:left; font-size:0.8rem; color:var(--muted); }
        td { padding:0.5rem 1rem; border-bottom:1px solid var(--border); }
        #login { max-width:350px; margin:5rem auto; padding:2rem; background:var(--surface); border-radius:14px; text-align:center; }
        #login input { width:100%; padding:0.7rem; margin-bottom:1rem; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; }
        #login button, .btn { padding:0.7rem 1.5rem; background:var(--accent); color:var(--bg); border:none; border-radius:6px; cursor:pointer; font-weight:600; }
        .hidden { display:none !important; }
        .error { color:var(--err); margin-top:0.5rem; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
        .stat-row { display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid var(--border); }
        .event-item { padding:0.5rem 1rem; border-bottom:1px solid var(--border); font-family:monospace; font-size:0.85rem; }
    </style>
</head>
<body>
    <div id="login">
        <h1 style="color:var(--accent);margin-bottom:1rem">Vigile</h1>
        <input type="password" id="token" placeholder="Token administrateur">
        <button onclick="login()">Se connecter</button>
        <div class="error hidden" id="login-error">Token invalide</div>
    </div>
    <nav id="nav" class="hidden">
        <h1>Vigile</h1>
        <a href="#" onclick="showPage('dashboard')" id="nav-dashboard">Dashboard</a>
        <a href="#" onclick="showPage('fapolicyd')" id="nav-fapolicyd">Observation</a>
        <a href="#" onclick="showPage('audit')" id="nav-audit">Audit</a>
    </nav>
    <main id="main" class="hidden">
        <div id="page-dashboard">
            <h2 style="margin-bottom:1rem">Tableau de bord</h2>
            <div class="grid" id="dashboard-cards"></div>
        </div>
        <div id="page-fapolicyd" class="hidden">
            <h2 style="margin-bottom:1rem">Observation fapolicyd</h2>
            <div class="card" id="fapolicyd-events"><p style="color:var(--muted)">Chargement...</p></div>
        </div>
        <div id="page-audit" class="hidden">
            <h2 style="margin-bottom:1rem">Journal d'audit</h2>
            <button class="btn" onclick="verifyChain()" style="margin-bottom:1rem">Verifier la chaine</button>
            <div id="verify-result" style="margin-bottom:1rem"></div>
            <table><thead><tr><th>#</th><th>Horodatage</th><th>Acteur</th><th>Action</th><th>Resultat</th></tr></thead><tbody id="audit-body"></tbody></table>
        </div>
    </main>
    <script>
        var TOKEN = '';
        var BASE = window.location.origin;

        function login() {
            var token = document.getElementById('token').value.trim();
            if (!token) return;
            fetch(BASE + '/admin/v1/status', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(function(res) {
                if (!res.ok) {
                    document.getElementById('login-error').classList.remove('hidden');
                    return;
                }
                TOKEN = token;
                sessionStorage.setItem('vigile-token', token);
                document.getElementById('login').classList.add('hidden');
                document.getElementById('nav').classList.remove('hidden');
                document.getElementById('main').classList.remove('hidden');
                loadDashboard();
            })
            .catch(function(e) {
                var el = document.getElementById('login-error');
                el.textContent = 'Erreur : ' + e.message;
                el.classList.remove('hidden');
            });
        }

        function showPage(name) {
            var pages = ['dashboard', 'fapolicyd', 'audit'];
            for (var i = 0; i < pages.length; i++) {
                var p = pages[i];
                document.getElementById('page-' + p).classList.toggle('hidden', p !== name);
                document.getElementById('nav-' + p).classList.toggle('active', p === name);
            }
            if (name === 'dashboard') loadDashboard();
            if (name === 'fapolicyd') loadFapolicyd();
            if (name === 'audit') loadAudit();
        }

        function api(path) {
            return fetch(BASE + path, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
                .then(function(res) { if (!res.ok) throw new Error('API ' + res.status); return res.json(); });
        }

        function loadDashboard() {
            api('/admin/v1/status').then(function(d) {
                var cards = [
                    { t: 'fapolicyd', v: d.fapolicyd ? 'Actif' : 'Inactif', c: d.fapolicyd ? 'ok' : 'err' },
                    { t: 'SELinux', v: d.selinux || '?', c: 'ok' },
                    { t: 'Pare-feu', v: d.firewalld ? 'Actif' : 'Inactif', c: d.firewalld ? 'ok' : 'err' },
                    { t: 'Paquets', v: (d.packages || 0).toLocaleString(), c: 'ok' },
                    { t: 'Evenements', v: (d.fanotify || 0).toLocaleString(), c: 'ok' },
                    { t: 'Non trustes', v: (d.untrusted || 0).toLocaleString(), c: (d.untrusted > 0 ? 'warn' : 'ok') },
                ];
                var html = cards.map(function(c) {
                    return '<div class="card"><h3 style="font-size:0.8rem;color:var(--muted);text-transform:uppercase">' + c.t + '</h3><div style="font-size:1.5rem;font-weight:700"><span class="badge ' + c.c + '">' + c.v + '</span></div></div>';
                }).join('');
                document.getElementById('dashboard-cards').innerHTML = html;
            }).catch(function(e) { console.error(e); });
        }

        function loadFapolicyd() {
            api('/admin/v1/fapolicyd').then(function(d) {
                var events = d.events || [];
                if (events.length === 0) {
                    document.getElementById('fapolicyd-events').innerHTML = '<p style="color:var(--muted);padding:1rem">Aucun evenement. Executez des programmes.</p>';
                    return;
                }
                var html = events.map(function(e) {
                    var icon = e.resp === '1' ? 'OK' : 'DENIED';
                    var color = e.obj_trust === '0' ? 'var(--warn)' : 'var(--ok)';
                    return '<div class="event-item"><span style="margin-right:0.5rem">' + icon + '</span><span style="color:' + color + '">trust=' + e.obj_trust + '</span><span style="color:var(--muted);margin-left:1rem">' + e.raw.substring(0, 90) + '</span></div>';
                }).join('');
                document.getElementById('fapolicyd-events').innerHTML = html;
            }).catch(function(e) {
                document.getElementById('fapolicyd-events').innerHTML = '<p class="error">Erreur : ' + e.message + '</p>';
            });
        }

        function loadAudit() {
            api('/admin/v1/audit').then(function(d) {
                var entries = (d.entries || []).slice().reverse();
                var html = entries.map(function(e) {
                    return '<tr><td>' + e.seq + '</td><td>' + new Date(e.at_unix * 1000).toISOString().slice(0, 19) + '</td><td>' + e.actor + '</td><td>' + e.action + '</td><td><span class="badge ' + (e.result === 'ok' ? 'ok' : 'err') + '">' + e.result + '</span></td></tr>';
                }).join('');
                document.getElementById('audit-body').innerHTML = html || '<tr><td colspan="5" style="color:var(--muted)">Aucune entree</td></tr>';
            }).catch(function(e) {
                document.getElementById('audit-body').innerHTML = '<tr><td colspan="5" class="error">' + e.message + '</td></tr>';
            });
        }

        function verifyChain() {
            api('/admin/v1/audit/verify').then(function(d) {
                document.getElementById('verify-result').innerHTML = d.valid
                    ? '<span class="badge ok">Valide (' + d.verified_entries + ' entrees)</span>'
                    : '<span class="badge err">Casse</span>';
                loadAudit();
            }).catch(function(e) {
                document.getElementById('verify-result').innerHTML = '<span class="badge err">' + e.message + '</span>';
            });
        }

        var saved = sessionStorage.getItem('vigile-token');
        if (saved) {
            document.getElementById('token').value = saved;
            login();
        }
        document.getElementById('token').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
